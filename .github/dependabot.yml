# Dependabot configuration.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Security updates (PRs that patch known vulnerabilities) are enabled separately
# in the repository's Security settings; this file drives *version* updates.
version: 2
updates:
  # Python dependencies resolved by uv (pyproject.toml + uv.lock).
  # uv support is GA in Dependabot since 2025-03.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Collapse routine bumps into a single PR to keep review noise down.
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Actions pinned in the workflows under .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
